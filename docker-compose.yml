services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nyayalay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nyayalay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong_password}
      POSTGRES_DB: ${POSTGRES_DB:-nyayalay}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nyayalay} -d ${POSTGRES_DB:-nyayalay}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nyayalay-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nyayalay-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nyayalay-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: nyayalay-ai-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:-change_me_internal_service_key_min_32_chars}
    ports:
      - "8000:8000"
    networks:
      - nyayalay-network

volumes:
  postgres_data:

networks:
  nyayalay-network:
    driver: bridge